{% extends "base.html" %}

{% block title %}{{ 'Edit' if warehouse else 'New' }} Warehouse{% endblock %}

{% block content %}
<div class="back-link">
    <a href="{{ url_for('index') }}" class="btn btn-secondary">&larr; Back to Warehouses</a>
</div>

<h1>{{ 'Edit' if warehouse else 'New' }} Warehouse</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" value="{{ warehouse['name'] if warehouse else '' }}" required>
    </div>
    
    <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ warehouse['location'] if warehouse else '' }}">
    </div>
    
    <div class="form-group">
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" name="capacity" step="0.01" min="0" value="{{ warehouse['capacity'] if warehouse else '0' }}">
    </div>
    
    <div class="actions">
        <button type="submit" class="btn btn-success">{{ 'Update' if warehouse else 'Create' }} Warehouse</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
