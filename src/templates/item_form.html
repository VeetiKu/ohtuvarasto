{% extends "base.html" %}

{% block title %}{{ 'Edit' if item else 'Add' }} Item - {{ warehouse['name'] }}{% endblock %}

{% block content %}
<div class="back-link">
    <a href="{{ url_for('view_warehouse', warehouse_id=warehouse['id']) }}" class="btn btn-secondary">&larr; Back to {{ warehouse['name'] }}</a>
</div>

<h1>{{ 'Edit' if item else 'Add' }} Item</h1>
<p>Warehouse: <strong>{{ warehouse['name'] }}</strong></p>

<form method="POST">
    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" value="{{ item['name'] if item else '' }}" required>
    </div>
    
    <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" step="0.01" min="0" value="{{ item['quantity'] if item else '0' }}">
    </div>
    
    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description">{{ item['description'] if item else '' }}</textarea>
    </div>
    
    <div class="actions">
        <button type="submit" class="btn btn-success">{{ 'Update' if item else 'Add' }} Item</button>
        <a href="{{ url_for('view_warehouse', warehouse_id=warehouse['id']) }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
